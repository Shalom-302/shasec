# Production compose for Dokploy — pulls the prebuilt image from GHCR (built by
# .github/workflows/build.yml) instead of building locally.
#
# Set the secrets below in the Dokploy "Environment" panel. In prod
# (ENVIRONMENT=prod) the app REFUSES to boot with the dev default secrets, so
# POSTGRES_PASSWORD / TOKEN_SECRET_KEY / OPERA_LOG_ENCRYPT_SECRET_KEY /
# MINIO_SECRET_KEY / DEEPSEEK_API_KEY are mandatory. See DEPLOY.md.
#
# Service names (postgres/redis/minio) are kept underscore-free so the MinIO/S3
# client accepts the host (it rejects names like "monshaapi_minio").

services:
  api:
    image: ghcr.io/shalom-302/shasec:latest
    restart: unless-stopped
    environment:
      # 'prod' by default (docs off, secret guard on). Set ENVIRONMENT=preprod in
      # Dokploy to expose Swagger at /api/v1/docs while keeping the secret guard —
      # works with the currently-deployed image (no rebuild needed).
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - DB_AUTO_CREATE=false
      # Alternative: keep ENVIRONMENT=prod and set this true (needs the image that
      # carries the FASTAPI_EXPOSE_DOCS flag).
      - FASTAPI_EXPOSE_DOCS=${FASTAPI_EXPOSE_DOCS:-false}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      # Defaults let the stack boot out-of-the-box; they are NOT 'postgres'/'minioadmin'
      # so the prod safety guard still passes. ⚠️ Override these in Dokploy for real prod.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shasec_pg_changeme}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-monshaapi}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-shasecadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-shasec_minio_changeme}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-monshaapi}
      - MINIO_CLOUD_URL=${MINIO_CLOUD_URL:-http://localhost:9000}
      # ⚠️ MANDATORY for security — set in Dokploy (forgeable JWTs if left empty):
      - TOKEN_SECRET_KEY=${TOKEN_SECRET_KEY}
      - OPERA_LOG_ENCRYPT_SECRET_KEY=${OPERA_LOG_ENCRYPT_SECRET_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # Scans go through the arq queue (worker service below): at most
      # SHASEC_MAX_CONCURRENT_SCANS run at once, the rest wait as "queued".
      - SHASEC_USE_ARQ=${SHASEC_USE_ARQ:-true}
      - SHASEC_MAX_CONCURRENT_SCANS=${SHASEC_MAX_CONCURRENT_SCANS:-2}
      - SHASEC_MAX_ACTIVE_SCANS_PER_USER=${SHASEC_MAX_ACTIVE_SCANS_PER_USER:-1}
      # OWASP ZAP (the `zap` service below); active scan is opt-in (heavy/intrusive).
      - ZAP_ENDPOINT=http://zap:8090
      - ZAP_API_KEY=${ZAP_API_KEY:-shasec-zap}
      - ZAP_ACTIVE_SCAN=${ZAP_ACTIVE_SCAN:-false}
      # Hermes assistant — the backend relays /hermes/chat here (internal network
      # only; never a public port). Empty => the chat feature is simply off.
      - HERMES_URL=${HERMES_URL:-}
      - HERMES_TOKEN=${HERMES_TOKEN:-}
      # WhatsApp OTP at sign-up (gowa). OTP_ENABLED=true turns the gate on.
      - OTP_ENABLED=${OTP_ENABLED:-false}
      - GOWA_URL=${GOWA_URL:-}
      - GOWA_BASIC_USER=${GOWA_BASIC_USER:-}
      - GOWA_BASIC_PASS=${GOWA_BASIC_PASS:-}
      # Password-protected private Swagger (see FASTAPI_PRIVATE_DOCS_PATH).
      - DOCS_BASIC_USER=${DOCS_BASIC_USER:-}
      - DOCS_BASIC_PASSWORD=${DOCS_BASIC_PASSWORD:-}
    # Dokploy/Traefik routes the public domain to this container port.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    # Unique alias: Dokploy also attaches services to the shared dokploy-network,
    # where a bare "api" can resolve to ANOTHER project's api container.
    networks:
      shasec:
        aliases: [shasec-api]
      # Shared bridge with the Hermes stack: the API reaches http://hermes-http:8700,
      # and Hermes reaches the API at http://shasec-api:8000 (stable alias here too).
      hermes-link:
        aliases: [shasec-api]
      # WhatsApp gateway (gowa) network, so the API can send sign-up OTPs via
      # http://shalom-gowa:3080. Create once on the VPS if missing.
      whatsapp-shared-network: {}

  # Kortex Security web console (Next.js, shasec-web/). Talks to the API over the
  # internal `shasec` network only — the browser never reaches the API directly.
  # In Dokploy, point the public domain at service `web`, port 3000.
  web:
    image: ghcr.io/shalom-302/shasec-web:latest
    restart: unless-stopped
    environment:
      - SHAAPI_URL=http://shasec-api:8000
      # Must match the API's settings.COOKIE_REFRESH_TOKEN_KEY.
      - SHAAPI_REFRESH_COOKIE=${SHAAPI_REFRESH_COOKIE:-monshaapi_refresh_token}
      # "true" once the domain is served over HTTPS (Secure session cookies).
      - COOKIE_SECURE=${WEB_COOKIE_SECURE:-false}
    expose:
      - "3000"
    depends_on:
      - api
    networks: [shasec]

  # arq worker — runs the scan pipeline jobs enqueued by the API (durability:
  # a scan survives an API restart). Same image, different entrypoint.
  worker:
    image: ghcr.io/shalom-302/shasec:latest
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shasec_pg_changeme}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-monshaapi}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-shasecadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-shasec_minio_changeme}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-monshaapi}
      - MINIO_CLOUD_URL=${MINIO_CLOUD_URL:-http://localhost:9000}
      - TOKEN_SECRET_KEY=${TOKEN_SECRET_KEY}
      - OPERA_LOG_ENCRYPT_SECRET_KEY=${OPERA_LOG_ENCRYPT_SECRET_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - SHASEC_USE_ARQ=true
      # Worker concurrency (arq max_jobs) — size it to the VPS.
      - SHASEC_MAX_CONCURRENT_SCANS=${SHASEC_MAX_CONCURRENT_SCANS:-2}
      - ZAP_ENDPOINT=http://zap:8090
      - ZAP_API_KEY=${ZAP_API_KEY:-shasec-zap}
      - ZAP_ACTIVE_SCAN=${ZAP_ACTIVE_SCAN:-false}
    # Wrapped in sh -c so a missing 'arq' (stale image) only restart-loops this
    # one container instead of failing `docker compose up` for the whole stack.
    entrypoint: ["sh", "-c", "exec arq backend.app.shasec.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [shasec]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      # Must match the api's POSTGRES_PASSWORD above (same default / same override).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shasec_pg_changeme}
      - POSTGRES_DB=${POSTGRES_DATABASE:-monshaapi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-monshaapi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [shasec]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [shasec]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Must match the api's MINIO_ACCESS_KEY / MINIO_SECRET_KEY (same default / override).
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-shasecadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-shasec_minio_changeme}
    volumes:
      - miniodata:/data
    networks: [shasec]

  # OWASP ZAP daemon — spider + passive scan on every scan; active scan is opt-in
  # (ZAP_ACTIVE_SCAN=true on api/worker). Heavy (~1.5 GB Java): delete this service
  # if your VPS is small — the zap plugin then just skips cleanly (an INFO finding).
  zap:
    image: zaproxy/zap-stable
    restart: unless-stopped
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:-shasec-zap}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    networks: [shasec]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  shasec:
  # The Hermes containers live in another compose project; join their network so
  # the API resolves `hermes-http`. Create it once on the VPS, then reference it
  # from BOTH stacks:  docker network create hermes-link
  hermes-link:
    external: true
  whatsapp-shared-network:
    external: true
