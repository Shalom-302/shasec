name: Build & push image

# Builds the API image (ghcr.io/<owner>/shasec) and the web console image
# (ghcr.io/<owner>/shasec-web, from shasec-web/) and pushes both to GHCR on every
# push to main. Dokploy then pulls the :latest tags in prod (see compose.image.yml).
# Uses the built-in GITHUB_TOKEN — no extra secrets.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ''            # API -> ghcr.io/<owner>/shasec
            context: .
            file: ./Dockerfile
          - image: '-web'        # web console -> ghcr.io/<owner>/shasec-web
            context: ./shasec-web
            file: ./shasec-web/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=build${{ matrix.image }}
